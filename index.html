    <style>
      /* Splash shown until the app has loaded (React replaces it). */
      .splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f5f3ef; }
      .splash svg { width: 64px; height: 64px; animation: splash-pulse 1.2s ease-in-out infinite; }
      @keyframes splash-pulse { 50% { transform: scale(.92); opacity: .75; } }
      @media (prefers-reduced-motion: reduce) { .splash svg { animation: none; } }
    </style>
